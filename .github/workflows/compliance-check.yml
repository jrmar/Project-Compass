name: Monthly Compliance Framework Check

on:
  schedule:
    # Runs at 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:  # Allow manual trigger from the Actions tab

jobs:
  check-framework-updates:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Check OWASP LLM Top 10 for new releases
        id: owasp
        run: |
          LATEST=$(curl -s https://api.github.com/repos/OWASP/www-project-top-10-for-large-language-model-applications/releases/latest \
            -H "Accept: application/vnd.github+json" \
            | jq -r '.tag_name // "none"')
          echo "latest_release=$LATEST" >> $GITHUB_OUTPUT
          echo "OWASP LLM Top 10 latest release: $LATEST"

      - name: Check NIST AI publications (CSRC news)
        id: nist
        run: |
          # Pull the NIST CSRC publications feed for AI-related docs
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://csrc.nist.gov/publications/search?series-name=ai&sortBy=datePub&page-num=1")
          echo "nist_status=$STATUS" >> $GITHUB_OUTPUT
          echo "NIST CSRC AI publications endpoint status: $STATUS"

      - name: Create reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const owaspRelease = '${{ steps.owasp.outputs.latest_release }}';
            const nistStatus   = '${{ steps.nist.outputs.nist_status }}';
            const today        = new Date().toISOString().split('T')[0];

            const body = [
              '## Monthly Compliance Framework Review',
              '',
              `**Date:** ${today}`,
              '',
              '### OWASP LLM Top 10',
              `- Latest release detected: \`${owaspRelease}\``,
              '- Review: https://owasp.org/www-project-top-10-for-large-language-model-applications/',
              '- Check if `app/compliance.html` OWASP section needs updating',
              '',
              '### NIST AI Framework',
              `- CSRC publications endpoint status: HTTP ${nistStatus}`,
              '- Review: https://airc.nist.gov/Home',
              '- Check for new AI RMF supplemental documents, AI 600-1 updates, or SP 800-218A revisions',
              '',
              '### Checklist',
              '- [ ] Compare OWASP release tag against version documented in `compliance.html`',
              '- [ ] Check NIST CSRC for new AI-related publications since last review',
              '- [ ] Update the "Content last reviewed" date in `compliance.html` after any changes',
              '- [ ] Push updated `compliance.html` to trigger Vercel redeploy',
              '',
              '---',
              '*This issue was opened automatically by the monthly compliance check workflow.*',
              '*Close it once the review is complete, or update `compliance.html` and then close.*',
            ].join('\n');

            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  `[Compliance] Monthly framework review — ${today}`,
              body,
              labels: ['compliance', 'maintenance'],
            });
