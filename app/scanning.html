<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Compass - Analyzing...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 50%, rgba(64,130,232,0.07) 0%, transparent 65%);
    }

    .scan-container {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    /* ---- Logo ---- */
    .scan-logo {
      height: 44px;
      width: auto;
      border-radius: 8px;
      margin-bottom: 40px;
      opacity: 0.85;
    }

    /* ---- Radar pulse animation ---- */
    .radar-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 36px;
    }

    .radar-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--teal);
      opacity: 0;
      animation: radar-pulse 2s ease-out infinite;
    }

    .radar-ring:nth-child(2) { animation-delay: 0.6s; }
    .radar-ring:nth-child(3) { animation-delay: 1.2s; }

    @keyframes radar-pulse {
      0%   { transform: scale(0.3); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .radar-core {
      position: absolute;
      inset: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(51,205,182,0.25) 0%, rgba(51,205,182,0.05) 60%, transparent 100%);
      border: 2px solid rgba(51, 205, 182, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    /* ---- Title / Status ---- */
    .scan-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      color: var(--light);
    }

    .scan-org {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* ---- Progress bar ---- */
    .scan-progress-wrap {
      margin-bottom: 16px;
    }

    .scan-progress-pct {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .scan-progress-pct .pct-val { color: var(--teal); font-weight: 700; }

    /* ---- Stage log ---- */
    .stage-log {
      background: rgba(9, 26, 54, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 18px 20px;
      text-align: left;
      margin-top: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .log-line {
      display: flex;
      gap: 10px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .log-line.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .log-time { color: var(--muted); flex-shrink: 0; }
    .log-status { color: var(--teal); flex-shrink: 0; }
    .log-status.warn { color: var(--orange); }
    .log-msg { color: var(--light); }

    /* ---- Completion overlay ---- */
    .scan-done {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .done-check {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(51, 205, 182, 0.15);
      border: 2px solid var(--teal);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes pop-in {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .done-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--teal);
    }

    .done-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .scan-disclaimer {
      margin-top: 28px;
      font-size: 11px;
      color: var(--muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="scan-container">

    <img class="scan-logo"
         src="../brand_assets/New Main Logo Project Compass Image 1.png"
         alt="Project Compass">

    <!-- Radar animation -->
    <div class="radar-wrap">
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-ring"></div>
      <div class="radar-core">&#128270;</div>
    </div>

    <!-- Title -->
    <div class="scan-title" id="scan-title">Running COMPASS Analysis</div>
    <div class="scan-org" id="scan-org">Scanning logs for AI tool activity...</div>

    <!-- Progress bar -->
    <div class="scan-progress-wrap">
      <div class="scan-progress-pct">
        <span>Progress</span>
        <span class="pct-val" id="pct-label">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <!-- Stage log -->
    <div class="stage-log" id="stage-log"></div>

    <p class="scan-disclaimer">Do not close this window during analysis.</p>

  </div><!-- /.scan-container -->

  <script>
    // ---- Guard: require a session ----
    const session = JSON.parse(localStorage.getItem('compass_session') || 'null');
    if (!session || !session.org_name) {
      window.location.href = 'login.html';
    }

    if (session) {
      document.getElementById('scan-org').textContent =
        `Analyzing logs for ${session.org_name}...`;
    }

    // ---- Animation stages ----
    const now = () => {
      const d = new Date();
      return d.toTimeString().slice(0, 8);
    };

    const stages = [
      { pct: 5,  delay: 200,  status: 'INFO', msg: 'COMPASS engine initialized' },
      { pct: 14, delay: 600,  status: 'INFO', msg: 'Reading DNS log entries...' },
      { pct: 26, delay: 1100, status: 'INFO', msg: `Parsed ${getRowCount()} log rows across ${getFileCount()} file(s)` },
      { pct: 38, delay: 1700, status: 'INFO', msg: 'Loading AI domain registry (70 entries)...' },
      { pct: 52, delay: 2300, status: 'INFO', msg: 'Matching queried domains against registry...' },
      { pct: 64, delay: 2900, status: 'WARN', msg: '3 high-risk domains flagged for review' },
      { pct: 75, delay: 3500, status: 'INFO', msg: 'Scoring risk levels (NIST AI RMF)...' },
      { pct: 84, delay: 4100, status: 'INFO', msg: 'Correlating users to detected tools...' },
      { pct: 91, delay: 4600, status: 'INFO', msg: 'Building findings report...' },
      { pct: 97, delay: 5100, status: 'INFO', msg: 'Finalizing 13 detected tools across 5 users' },
      { pct: 100, delay: 5700, status: 'OK',  msg: 'Analysis complete. Redirecting...' },
    ];

    function getRowCount() {
      if (session && session.upload && session.upload.files) {
        const total = session.upload.files.reduce((s, f) => s + (f.rows || 0), 0);
        return total > 0 ? total.toLocaleString() : '1,240';
      }
      return '1,240';
    }

    function getFileCount() {
      if (session && session.upload && session.upload.files) {
        return session.upload.files.length;
      }
      return 1;
    }

    // ---- Run animation ----
    const logEl = document.getElementById('stage-log');
    const fillEl = document.getElementById('progress-fill');
    const pctEl  = document.getElementById('pct-label');

    stages.forEach((stage, i) => {
      setTimeout(() => {
        // Update progress bar
        fillEl.style.width = stage.pct + '%';
        pctEl.textContent = stage.pct + '%';

        // Append log line
        const line = document.createElement('div');
        line.className = 'log-line';
        const statusClass = stage.status === 'WARN' ? 'log-status warn' : 'log-status';
        line.innerHTML = `
          <span class="log-time">${now()}</span>
          <span class="${statusClass}">[${stage.status}]</span>
          <span class="log-msg">${stage.msg}</span>
        `;
        logEl.appendChild(line);

        // Animate in
        requestAnimationFrame(() => {
          requestAnimationFrame(() => line.classList.add('visible'));
        });

        // Scroll log to bottom
        logEl.scrollTop = logEl.scrollHeight;

        // Last stage: load seeded data then redirect
        if (i === stages.length - 1) {
          loadSeedDataAndRedirect();
        }
      }, stage.delay);
    });

    // ---- Load seeded detection results ----
    function loadSeedDataAndRedirect() {
      fetch('../project_compass_seeded_detection_results_frontend.json')
        .then(r => {
          if (!r.ok) throw new Error('fetch failed');
          return r.json();
        })
        .then(data => {
          session.detection = data;
          localStorage.setItem('compass_session', JSON.stringify(session));
          setTimeout(() => { window.location.href = 'detect.html'; }, 700);
        })
        .catch(() => {
          // Fallback: redirect anyway with a flag so detect.html uses its own bundled data
          session.detection = { _fallback: true };
          localStorage.setItem('compass_session', JSON.stringify(session));
          setTimeout(() => { window.location.href = 'detect.html'; }, 700);
        });
    }
  </script>
</body>
</html>
